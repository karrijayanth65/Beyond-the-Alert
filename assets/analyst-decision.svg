<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><rect width="100%" height="100%" fill="white"/>
<text x="70" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#202a33">The analyst owns the decision</text>
<text x="70" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#55616b">A priority label is an investigation lead, not a confirmed incident.</text>
<rect x="70" y="190" width="600" height="145" rx="14" fill="#f4f8f9" stroke="#acbdc4" stroke-width="2"/>
<text x="90" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#202a33">Validate the change</text>
<text x="90" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Confirm account owner and approval.</text>
<text x="90" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Separate the initiating user from the changed account.</text>
<rect x="830" y="190" width="600" height="145" rx="14" fill="#f4f8f9" stroke="#acbdc4" stroke-width="2"/>
<text x="850" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#202a33">Correlate surrounding activity</text>
<text x="850" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Review logons, process execution and privilege use.</text>
<text x="850" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Preserve timestamps and identify telemetry gaps.</text>
<path d="M670 260 L830 260" stroke="#159cab" stroke-width="5"/>
<polygon points="830,260 816.8362615716444,267.19138307906303 816.8362615716444,252.80861692093694" fill="#159cab"/>
<rect x="70" y="485" width="600" height="170" rx="14" fill="#f4f8f9" stroke="#acbdc4" stroke-width="2"/>
<text x="90" y="530" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#202a33">Expected and approved</text>
<text x="90" y="569" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Document the evidence and business context.</text>
<text x="90" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Close only according to the approved case policy.</text>
<text x="90" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Retain the reasoning for later review.</text>
<rect x="830" y="485" width="600" height="170" rx="14" fill="#f4f8f9" stroke="#acbdc4" stroke-width="2"/>
<text x="850" y="530" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#202a33">Unexplained or suspicious</text>
<text x="850" y="569" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Escalate with evidence and uncertainty.</text>
<text x="850" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Plan a scoped, authorized response.</text>
<text x="850" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#202a33">Containment is not performed by this code.</text>
<path d="M1130 335 L370 485" stroke="#159cab" stroke-width="5"/>
<polygon points="370,485 381.5221125779545,475.39578625076774 384.30709119621315,489.5063445832781" fill="#159cab"/>
<path d="M1130 335 L1130 485" stroke="#159cab" stroke-width="5"/>
<polygon points="1130,485 1122.8086169209369,471.8362615716444 1137.1913830790631,471.8362615716444" fill="#159cab"/>
<text x="70" y="820" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#65747c">Beyond the Alert  |  Original explanatory diagram  |  Service execution remains to be validated</text>
</svg>